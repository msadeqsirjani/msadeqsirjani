<?xml version="1.0" encoding="utf-8"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="'Fira Code', 'JetBrains Mono', 'Cascadia Code', Consolas, monospace" width="975px" height="550px" font-size="16px">
<defs>
  <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
    <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
  </linearGradient>
  <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#ffa657;stop-opacity:0.3" />
    <stop offset="100%" style="stop-color:#a5d6ff;stop-opacity:0.3" />
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
    <feMerge>
      <feMergeNode in="coloredBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>
<style>
.keyColor {fill: #ffa657; font-weight: 600;}
.valueColor {fill: #a5d6ff;}
.accentText {fill: #79c0ff; font-weight: 700;}
.highlightColor {fill: #3fb950;}
.delColor {fill: #f85149;}
.commentColor {fill: #8b949e;}
text, tspan {white-space: pre;}
.header {font-size: 28px; font-weight: 700; fill: #58a6ff; filter: url(#glow);}
.section-title {font-size: 18px; font-weight: 700; fill: #ffa657;}
.divider {stroke: #30363d; stroke-width: 2; opacity: 0.5;}
</style>

